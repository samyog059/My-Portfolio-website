<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Todo List App - Samyog Pangeni</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f5f8ff;
      --bg-secondary: #e7eefc;
      --primary: #2563eb;
      --secondary: #0ea5e9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border: #dbeafe;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', 'JetBrains Mono', sans-serif;
      background:
        linear-gradient(rgba(37, 99, 235, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 12% 18%, rgba(14, 165, 233, 0.12), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(37, 99, 235, 0.1), transparent 30%),
        linear-gradient(145deg, #f9fbff 0%, #eef3ff 55%, #e5edff 100%);
      background-size: 140px 140px, 140px 140px, auto, auto, auto;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #f8fbff;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.16);
      border: 1px solid rgba(37, 99, 235, 0.22);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(20, 241, 255, 0.35);
    }

    .container {
      max-width: 620px;
      width: 100%;
      margin-top: 4rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 5vw, 3.1rem);
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.04em;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 3rem;
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .todo-box {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      position: relative;
      overflow: hidden;
    }

    .todo-box::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(120deg, rgba(37, 99, 235, 0.12), rgba(14, 165, 233, 0.12));
      filter: blur(24px);
      z-index: 0;
    }

    .todo-box * { position: relative; z-index: 1; }

    .todo-input-box {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    #todoInput {
      flex: 1;
      padding: 1rem 1.5rem;
      border: 1.8px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.25s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    #todoInput:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.18);
      background: rgba(37, 99, 235, 0.08);
    }

    #todoInput::placeholder {
      color: var(--text-secondary);
    }

    #addTodoBtn {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #f8fbff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.25s ease;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.18);
    }

    #addTodoBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.2);
    }

    .todo-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: rgba(37, 99, 235, 0.08);
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .todo-list::-webkit-scrollbar {
      width: 8px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: rgba(10, 10, 15, 0.3);
      border-radius: 10px;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.25s ease;
      animation: slideIn 0.3s ease;
      box-shadow: inset 0 0 8px rgba(37, 99, 235, 0.08);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .todo-item:hover {
      border-color: rgba(10, 255, 157, 0.4);
      background: rgba(4, 8, 12, 0.95);
      transform: translateX(5px);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .todo-checkbox {
      min-width: 24px;
      width: 24px;
      height: 24px;
      border: 2px solid var(--primary);
      border-radius: 6px;
      cursor: pointer;
      appearance: none;
      position: relative;
      transition: all 0.25s ease;
      background: rgba(37, 99, 235, 0.08);
      box-shadow: inset 0 0 10px rgba(37, 99, 235, 0.12);
    }

    .todo-checkbox:checked {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-color: var(--secondary);
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.25);
    }

    .todo-checkbox:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 16px;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .todo-text {
      flex: 1;
      color: var(--text-primary);
      font-size: 1rem;
      word-break: break-word;
      line-height: 1.5;
      font-family: 'JetBrains Mono', monospace;
    }

    .todo-delete {
      background: rgba(239, 68, 68, 0.14);
      color: #b91c1c;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.25s ease;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .todo-delete:hover {
      background: #ef4444;
      color: #fff7f7;
      transform: scale(1.05);
      box-shadow: 0 8px 18px rgba(239, 68, 68, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .back-btn {
        top: 1rem;
        left: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }

      .container {
        margin-top: 3rem;
      }

      .todo-box {
        padding: 1.5rem;
      }

      .todo-input-box {
        flex-direction: column;
        gap: 0.75rem;
      }

      #addTodoBtn {
        width: 100%;
      }

      .todo-item {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body>
  <a href="index.html#projects" class="back-btn">← Back to Portfolio</a>

  <div class="container">
    <h1>📝 Todo List</h1>
    <p class="subtitle">Keep track of your tasks efficiently</p>

    <div class="todo-box">
      <div class="todo-input-box">
        <input type="text" id="todoInput" placeholder="What do you need to do?" />
        <button id="addTodoBtn">Add Task</button>
      </div>

      <div class="todo-stats">
        <span id="totalTasks">Total: 0</span>
        <span id="completedTasks">Completed: 0</span>
        <span id="pendingTasks">Pending: 0</span>
      </div>

      <ul id="todoList" class="todo-list">
        <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          <p>No tasks yet. Add one to get started!</p>
        </div>
      </ul>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const pending = total - completed;

      document.getElementById('totalTasks').textContent = `Total: ${total}`;
      document.getElementById('completedTasks').textContent = `Completed: ${completed}`;
      document.getElementById('pendingTasks').textContent = `Pending: ${pending}`;
    }

    function renderTodos() {
      const todoList = document.getElementById('todoList');
      
      if (todos.length === 0) {
        todoList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <p>No tasks yet. Add one to get started!</p>
          </div>
        `;
        updateStats();
        return;
      }

      todoList.innerHTML = '';
      
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} 
                 onchange="toggleTodo(${index})">
          <span class="todo-text">${todo.text}</span>
          <button class="todo-delete" onclick="deleteTodo(${index})">Delete</button>
        `;
        
        todoList.appendChild(li);
      });

      updateStats();
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      
      if (text) {
        todos.push({ text, completed: false, createdAt: new Date().toISOString() });
        input.value = '';
        saveTodos();
        renderTodos();
      }
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveTodos();
      renderTodos();
    }

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    document.getElementById('addTodoBtn').addEventListener('click', addTodo);
    document.getElementById('todoInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTodo();
      }
    });

    renderTodos();
  </script>
</body>
</html>
