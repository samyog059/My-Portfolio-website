<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - Samyog Pangeni</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #020304;
      --bg-secondary: #0a1016;
      --primary: #0aff9d;
      --secondary: #14f1ff;
      --text-primary: #e6fff4;
      --text-secondary: rgba(201, 255, 232, 0.76);
      --border: rgba(10, 255, 157, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', 'JetBrains Mono', sans-serif;
      background:
        linear-gradient(rgba(10, 255, 157, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10, 255, 157, 0.06) 1px, transparent 1px),
        radial-gradient(circle at 15% 20%, rgba(20, 241, 255, 0.18), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(10, 255, 157, 0.14), transparent 30%),
        linear-gradient(145deg, #020304 0%, #04070c 55%, #020305 100%);
      background-size: 140px 140px, 140px 140px, auto, auto, auto;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #02130f;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(10, 255, 157, 0.3);
      border: 1px solid rgba(10, 255, 157, 0.35);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(20, 241, 255, 0.35);
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 5vw, 3.1rem);
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.04em;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .calculator {
      background: rgba(6, 10, 14, 0.9);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .calculator::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(120deg, rgba(10, 255, 157, 0.12), rgba(20, 241, 255, 0.08));
      filter: blur(30px);
      z-index: 0;
    }

    .calculator * { position: relative; z-index: 1; }

    .calc-display {
      background: rgba(4, 8, 12, 0.9);
      color: var(--text-primary);
      font-size: clamp(2rem, 5vw, 3rem);
      padding: 1.5rem;
      border-radius: 15px;
      margin-bottom: 1.5rem;
      text-align: right;
      font-weight: 300;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      word-break: break-all;
      border: 1px solid var(--border);
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: inset 0 0 18px rgba(10, 255, 157, 0.12);
    }

    .calc-display::-webkit-scrollbar {
      height: 6px;
    }

    .calc-display::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .calc-btn {
      padding: 1.4rem;
      font-size: 1.45rem;
      border: none;
      border-radius: 15px;
      background: rgba(10, 255, 157, 0.08);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      min-height: 70px;
    }

    .calc-btn:hover {
      background: rgba(20, 241, 255, 0.18);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(10, 255, 157, 0.25);
    }

    .calc-btn:active {
      transform: translateY(0) scale(0.95);
    }

    .calc-operator {
      background: linear-gradient(135deg, rgba(10, 255, 157, 0.16), rgba(20, 241, 255, 0.16));
      font-weight: 700;
    }

    .calc-operator:hover {
      background: linear-gradient(135deg, rgba(10, 255, 157, 0.24), rgba(20, 241, 255, 0.24));
    }

    .calc-clear {
      background: rgba(255, 80, 80, 0.18);
      color: #ff6b6b;
      font-weight: 700;
      border-color: rgba(255, 80, 80, 0.35);
    }

    .calc-clear:hover {
      background: rgba(255, 80, 80, 0.28);
      color: #ffecec;
    }

    .calc-equals {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #03140f;
      font-weight: 800;
      font-size: 2rem;
      box-shadow: 0 10px 25px rgba(10, 255, 157, 0.28);
    }

    .calc-equals:hover {
      box-shadow: 0 12px 28px rgba(20, 241, 255, 0.35);
    }

    .keyboard-hint {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
    }

    @media (max-width: 768px) {
      .back-btn {
        top: 1rem;
        left: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }

      .calculator {
        padding: 1.5rem;
        border-radius: 20px;
      }

      .calc-display {
        font-size: 2rem;
        padding: 1rem;
        min-height: 70px;
      }

      .calc-buttons {
        gap: 0.75rem;
      }

      .calc-btn {
        padding: 1.2rem;
        font-size: 1.3rem;
        min-height: 60px;
        border-radius: 12px;
      }

      .calc-equals {
        font-size: 1.6rem;
      }

      .keyboard-hint {
        font-size: 0.85rem;
        padding: 0 1rem;
      }
    }

    @media (max-width: 480px) {
      .calc-btn {
        padding: 1rem;
        font-size: 1.1rem;
        min-height: 55px;
      }

      .calc-buttons {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <a href="index.html#projects" class="back-btn">← Back to Portfolio</a>

  <div class="container">
    <h1>🔢 Calculator</h1>
    <p class="subtitle">Perform your calculations with ease</p>

    <div class="calculator">
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-buttons">
        <button class="calc-btn calc-clear" onclick="clearCalc()">C</button>
        <button class="calc-btn calc-operator" onclick="appendCalc('/')">/</button>
        <button class="calc-btn calc-operator" onclick="appendCalc('*')">×</button>
        <button class="calc-btn calc-operator" onclick="deleteCalc()">⌫</button>
        
        <button class="calc-btn" onclick="appendCalc('7')">7</button>
        <button class="calc-btn" onclick="appendCalc('8')">8</button>
        <button class="calc-btn" onclick="appendCalc('9')">9</button>
        <button class="calc-btn calc-operator" onclick="appendCalc('-')">−</button>
        
        <button class="calc-btn" onclick="appendCalc('4')">4</button>
        <button class="calc-btn" onclick="appendCalc('5')">5</button>
        <button class="calc-btn" onclick="appendCalc('6')">6</button>
        <button class="calc-btn calc-operator" onclick="appendCalc('+')">+</button>
        
        <button class="calc-btn" onclick="appendCalc('1')">1</button>
        <button class="calc-btn" onclick="appendCalc('2')">2</button>
        <button class="calc-btn" onclick="appendCalc('3')">3</button>
        <button class="calc-btn calc-equals" onclick="calculateCalc()" style="grid-row: span 2">=</button>
        
        <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2">0</button>
        <button class="calc-btn" onclick="appendCalc('.')">.</button>
      </div>
    </div>

    <p class="keyboard-hint">💡 Tip: You can use your keyboard! (Numbers, operators, Enter, Escape, Backspace)</p>
  </div>

  <script>
    let calcDisplay = '';

    function updateCalcDisplay() {
      const display = document.getElementById('calcDisplay');
      display.textContent = calcDisplay || '0';
    }

    function appendCalc(value) {
      if (calcDisplay === '0' && value !== '.') {
        calcDisplay = value;
      } else if (calcDisplay === 'Error') {
        calcDisplay = value;
      } else {
        calcDisplay += value;
      }
      updateCalcDisplay();
    }

    function clearCalc() {
      calcDisplay = '';
      updateCalcDisplay();
    }

    function deleteCalc() {
      calcDisplay = calcDisplay.slice(0, -1);
      updateCalcDisplay();
    }

    function calculateCalc() {
      try {
        const expression = calcDisplay.replace(/×/g, '*').replace(/−/g, '-');
        const result = eval(expression);
        
        if (!isFinite(result)) {
          calcDisplay = 'Error';
        } else {
          calcDisplay = String(Math.round(result * 100000000) / 100000000);
        }
      } catch (error) {
        calcDisplay = 'Error';
      }
      updateCalcDisplay();
    }

    // Keyboard support
    document.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') {
        appendCalc(e.key);
      } else if (e.key === '.') {
        appendCalc('.');
      } else if (e.key === '+') {
        appendCalc('+');
      } else if (e.key === '-') {
        appendCalc('-');
      } else if (e.key === '*') {
        appendCalc('*');
      } else if (e.key === '/') {
        e.preventDefault();
        appendCalc('/');
      } else if (e.key === 'Enter') {
        e.preventDefault();
        calculateCalc();
      } else if (e.key === 'Escape') {
        clearCalc();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        deleteCalc();
      }
    });

    updateCalcDisplay();
  </script>
</body>
</html>
